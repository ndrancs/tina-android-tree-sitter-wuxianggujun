android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
tina.devAbi=arm64
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Windows / Android Studio 下 Kotlin daemon 偶发失联时，改用 in-process 编译更稳。
kotlin.compiler.execution.strategy=in-process
# AGP 9.x compatibility for legacy Android DSL / kotlin-android usage.
android.newDsl=false
android.builtInKotlin=false
