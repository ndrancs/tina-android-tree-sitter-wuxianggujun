pluginManagement {
    includeBuild("build-logic")
    repositories {
        // 主工程运行在 Windows/国内网络环境时，插件仓库优先走镜像，避免 TLS 握手失败。
        maven {
            url = uri("https://maven.aliyun.com/repository/google")
            name = "AliyunGoogleMirror"
        }
        maven {
            url = uri("https://maven.aliyun.com/repository/public")
            name = "AliyunPublicMirror"
        }
        maven {
            url = uri("https://maven.aliyun.com/repository/gradle-plugin")
            name = "AliyunGradlePluginMirror"
        }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    // Nyx requires a valid Git repository directory
    // When included as a submodule, .git is a file pointing to parent's .git/modules/...
    // which Nyx cannot handle properly, so we apply it conditionally below
    id("com.mooltiverse.oss.nyx") version "2.5.2" apply false

    // Grammars modules are automatically generated by this plugin
    id("android-tree-sitter.dynamic-modules")
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

// Check if this is a valid Git repository (not a submodule with .git file)
// When included as a submodule, .git is a file pointing to parent's .git/modules/...
def gitDir = file(".git")
def isValidGitRepo = gitDir.isDirectory()
def skipNyx = System.getenv("SKIP_NYX") == "true" || !isValidGitRepo

// Only apply and configure Nyx when we have a valid Git repository
if (!skipNyx) {
    apply plugin: "com.mooltiverse.oss.nyx"
    nyx {
      git {
        remotes.register("origin") {
          user.set("{{#environmentVariable}}GH_TOKEN{{/environmentVariable}}")
          password.set("")
        }
      }
      configurationFile.set(".nyx.yml")
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // 依赖解析同样优先走镜像，避免 Maven Central 在当前环境下握手失败。
        maven {
            url = uri("https://maven.aliyun.com/repository/google")
            name = "AliyunGoogleMirror"
        }
        maven {
            url = uri("https://maven.aliyun.com/repository/public")
            name = "AliyunPublicMirror"
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "ATS"

// Test application
include ':app'

// Android Tree Sitter library
include ':android-tree-sitter'
include ':annotations'
include ':annotation-processors'
